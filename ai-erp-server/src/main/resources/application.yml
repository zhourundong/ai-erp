server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:./data/ai-erp.db

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置
jwt:
  secret: ai-erp-jwt-secret-key-2024-very-long-secret-key-for-security
  expiration: 86400000  # 24小时

# 日志
logging:
  level:
    root: INFO
    com.aierp: DEBUG

# AI 模型配置
ai:
  default-model: other

  models:
    # 通义千问
    qwen-plus:
      enabled: false
      provider: aliyun
      api-key: ${QWEN_API_KEY:}
      endpoint: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
      model: qwen-plus
      max-tokens: 2000
      temperature: 0.7

    # 字节Seed
    byte-seed:
      enabled: false
      provider: bytedance
      api-key: ${SEED_API_KEY:}
      endpoint: https://api.bytedance.com/v1/chat/completions
      model: seed-1.6
      max-tokens: 4000
      temperature: 0.7

    # 文心一言
    wenxin:
      enabled: false
      provider: baidu
      api-key: ${WENXIN_API_KEY:}
      secret-key: ${WENXIN_SECRET_KEY:}
      endpoint: https://aip.baidubce.com/rpc/2.0/ai_custom/v1/wenxinworkshop/chat/completions
      model: ernie-bot-4
      max-tokens: 2000
      temperature: 0.7

    # OpenAI
    openai:
      enabled: false
      provider: openai
      api-key: ${OPENAI_API_KEY:}
      endpoint: https://api.openai.com/v1/chat/completions
      model: gpt-4
      max-tokens: 2000
      temperature: 0.7

    # 其他模型 (OpenAI协议兼容)
    other:
      enabled: true
      provider: openai-compatible
      api-key: ${OTHER_API_KEY:}
      endpoint: https://qianfan.baidubce.com/v2/coding/chat/completions
      model: ${OTHER_MODEL:default}
      max-tokens: 4000
      temperature: 0.7

  # 能力路由配置
  capability-routing:
    chat:
      primary: other
      fallback: qwen-plus
    predict:
      primary: other
      fallback: openai
    recommend:
      primary: other
      fallback: openai
