# Development profile - 使用H2内存数据库进行开发测试
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:aierp;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true

logging:
  level:
    com.aierp: DEBUG
    org.hibernate.SQL: DEBUG
